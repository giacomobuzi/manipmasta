; ManipMasta - build PlatformIO
; Lo sketch Arduino resta in manipmasta/ (compilabile anche con Arduino IDE 2)
[platformio]
src_dir = manipmasta
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    knolleary/PubSubClient@^2.8
    arduino-libraries/Ethernet@^2.0.2
build_flags =
    -Wall
