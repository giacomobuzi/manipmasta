# Mosquitto 2.x — broker ManipMasta
# Il broker NON deve essere raggiungibile da Internet: esporre la porta 1883
# solo sull'interfaccia della VLAN IoT (MQTT_BIND in .env) e filtrare con il firewall.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# limiti prudenti
max_inflight_messages 20
max_queued_messages 1000
max_packet_size 8192
