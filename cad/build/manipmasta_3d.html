<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ManipMasta 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco di lavoro — vista 3D a tutta altezza, pannello tecnico laterale con tre modalità (esplora, come funziona, montaggio); su telefono il pannello va sotto */
:root{
  --bg:#eef1f4; --panel:#f8f9fb; --ink:#1d242c; --muted:#5d6874; --line:#cfd6dd;
  --accent:#c98a00; --accent-ink:#ffffff; --viewport:#e3e8ed; --chip:#e4e9ee; --label:#1d242c; --label-ink:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181e; --panel:#1a2028; --ink:#e4e9ee; --muted:#93a0ad; --line:#2c3540;
  --accent:#f0b429; --accent-ink:#1a1400; --viewport:#161c23; --chip:#232b35; --label:#f0b429; --label-ink:#1a1400; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181e; --panel:#1a2028; --ink:#e4e9ee; --muted:#93a0ad; --line:#2c3540;
  --accent:#f0b429; --accent-ink:#1a1400; --viewport:#161c23; --chip:#232b35; --label:#f0b429; --label-ink:#1a1400; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%;min-height:560px}
.stage{position:relative;min-width:0;background:var(--viewport);overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-4px,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.lbl i{width:8px;height:8px;border-radius:50%;background:var(--label);box-shadow:0 0 0 2px var(--viewport)}
.lbl span{font:600 12px var(--f-body);background:var(--label);color:var(--label-ink);padding:3px 7px;border-radius:4px}
.head{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.views{position:absolute;top:12px;right:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.ctrl{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px 16px;align-items:end;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.ctrl label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.ctrl label b{font:500 13px var(--f-mono);color:var(--ink);letter-spacing:0;text-transform:none}
input[type=range]{width:100%;accent-color:var(--accent)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-block:0 16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.tabs{position:sticky;top:0;background:var(--panel);display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);z-index:2;margin-inline:-16px;padding-inline:8px}
.tab{font:600 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:14px 4px 11px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
aside h2{font:600 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted)}
aside h3{font:700 24px var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
aside p{margin:0;line-height:1.5;max-width:65ch}
.sel{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sel .code{font:500 12px var(--f-mono);color:var(--accent)}
.sel .nm{font:600 20px var(--f-display);line-height:1.1;text-wrap:balance}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0 0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
.hint{color:var(--muted);font-size:13px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.grp-h span{font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tog{font:500 11px var(--f-mono);background:var(--chip);border:0;color:var(--ink);padding:4px 8px;border-radius:4px;cursor:pointer;min-height:28px}
.tog.off{opacity:.45}
.part,.item{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-radius:4px;cursor:pointer;font-size:13px;border:0;background:none;color:var(--ink);text-align:left;width:100%;font-family:var(--f-body)}
.part:hover,.part.on,.item:hover,.item.on{background:var(--chip)}
.part code{font:500 11px var(--f-mono);color:var(--muted);flex:0 0 74px}
.item b{font:600 13px var(--f-mono);color:var(--accent);flex:0 0 28px}
.item span{font-size:14px}
ol.ops{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.box strong{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box ul{margin:0;padding-left:18px}
.check{border-left:3px solid #2a9a3a;padding-left:10px;font-size:14px}
.nav{display:flex;gap:8px;align-items:center}
.nav .count{font:500 13px var(--f-mono);color:var(--muted);margin-left:auto}
.flow{width:100%;height:auto}
.flow text{font:600 11px var(--f-body);fill:var(--ink)}
.flow .sub{font:400 10px var(--f-body);fill:var(--muted)}
.flow rect{fill:var(--chip);stroke:var(--line)}
.flow path{stroke:var(--accent);fill:none;stroke-width:2}
.flow .arr{fill:var(--accent)}
.foot{font-size:12px;color:var(--muted);line-height:1.5}
.stepbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stepbar .ttl{font:600 18px var(--f-display);min-width:0;flex:1 1 200px}
.stepbar .ttl small{display:block;font:500 12px var(--f-mono);color:var(--accent)}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:66vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
  .ctrl{grid-template-columns:1fr 1fr;left:8px;right:8px;bottom:8px;padding:8px 10px}
  .head h1{font-size:24px}.views{top:62px;left:16px;right:auto;justify-content:flex-start}
  .lbl span{font-size:11px}
  .stepbar .ttl{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

</head><body>
<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="Modello 3D della macchina"></canvas>
    <div id="labels"></div>
    <div class="head"><h1>ManipMasta</h1><p id="sub">Sfogliatrice a portale</p></div>
    <div class="views">
      <button class="btn" data-v="iso">Iso</button><button class="btn" data-v="front">Fronte</button>
      <button class="btn" data-v="side">Lato</button><button class="btn" data-v="top">Alto</button>
    </div>
    <div class="ctrl" id="ctrlExplore">
      <label for="ex">Esploso <b id="exv">0 %</b><input id="ex" type="range" min="0" max="100" value="0"></label>
      <label for="xp">Posizione rullo X <b id="xpv">0 mm</b><input id="xp" type="range" min="-700" max="700" value="0"></label>
      <label for="gp">Luce rullo–piano <b id="gpv">40.0 mm</b><input id="gp" type="range" min="2" max="150" value="40" step="0.5"></label>
      <button class="btn" id="run">Simula ciclo</button>
    </div>
    <div class="stepbar" id="ctrlTour" hidden>
      <div class="ttl" id="tourTtl"></div>
      <button class="btn" id="tourPlay">Pausa</button>
      <button class="btn" id="tourDoor" hidden>Chiudi sportello</button>
    </div>
    <div class="stepbar" id="ctrlStep" hidden>
      <button class="btn" id="stPrev" aria-label="Fase precedente">‹ Prec.</button>
      <div class="ttl" id="stTtl"></div>
      <button class="btn" id="stPlay">Pausa</button>
      <button class="btn primary" id="stNext" aria-label="Fase successiva">Succ. ›</button>
    </div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-explore" aria-selected="true">Esplora</button>
      <button class="tab" role="tab" id="tab-tour" aria-selected="false">Come funziona</button>
      <button class="tab" role="tab" id="tab-step" aria-selected="false">Montaggio</button>
    </div>
    <div id="pExplore">
      <section class="sel" id="info"><span class="code">—</span><span class="nm">Seleziona un pezzo</span><span class="hint">Tocca un componente nella vista o nell'elenco per vederne materiale, fissaggio e fornitura.</span></section>
      <h2 style="margin:14px 0 6px">Componenti</h2>
      <div id="list"></div>
    </div>
    <div id="pTour" hidden></div>
    <div id="pStep" hidden></div>
    <p class="foot">Modello concettuale generato da <code>cad/model.py</code> su tavolo ipotetico 2000×800: si rigenera con le misure reali.</p>
  </aside>
</div>

27,225.0],"mov":"xz","tours":["r"]},{"id":"r-belt","text":"Cinghia 20T \u2192 40T (2:1)","p":[25,-220,160.0],"mov":"xz","tours":["r"]},{"id":"r-rul","text":"Rullo \u00d8100: velocit\u00e0 periferica = velocit\u00e0 X","p":[60,40,140.0],"mov":"xz","tours":["r"]},{"id":"r-ras","text":"Raschietto POM-C","p":[-60,120,140.0],"mov":"xz","tours":["r"]},{"id":"r-brg","text":"Cuscinetto 6204 nella slitta","p":[0,-203,60.0],"mov":"xz","tours":["r"]},{"id":"m-1","text":"M1 \u00b7 asse X","p":[-885,525.0,470.0],"mov":"fixed","tours":["motori"]},{"id":"m-2","text":"M2 \u00b7 asse Z1","p":[-65,-223,695],"mov":"x","tours":["motori"]},{"id":"m-3","text":"M3 \u00b7 asse Z2","p":[-65,223,695],"mov":"x","tours":["motori"]},{"id":"m-4","text":"M4 \u00b7 asse R (rullo)","p":[0,-127,260.0],"mov":"xz","tours":["motori"]},{"id":"m-q","text":"Driver nel quadro","p":[-1086.0,30,245],"mov":"fixed","tours":["motori"]},{"id":"s-enc","text":"Encoder 1000 linee","p":[-885,560.0,460.0],"mov":"fixed","tours":["servo"]},{"id":"s-drv","text":"Driver CL57T nel quadro","p":[-1086.0,30,245],"mov":"fixed","tours":["servo"]},{"id":"s-ard","text":"Arduino: impulsi STEP/DIR","p":[-1090.0,-208.0,416],"mov":"fixed","tours":["servo"]}],"steps":[{"t":"Preparazione","ops":["Verificare la distinta: tutte le parti lavorate e acquistate presenti, forature [V] confrontate con i pezzi reali.","Pulire e sgrassare il piano; tracciare il centro del tavolo e gli assi X/Y."],"vit":[],"chk":"Piano pulito, assi tracciati.","cam":[-2300,-2700,1900],"tgt":[0,0,150]},{"t":"Ancoraggi fissi al tavolo","ops":["Tracciare i centri degli ancoraggi a (\u00b1930, \u00b1340) dal centro; forare il piano \u00d89 in 4 punti per ancoraggio (interasse 70\u00d770).","Appoggiare A1 (foro tondo) a X\u2212/Y\u2212, A2 (asola, lato lungo lungo X) a X+/Y\u2212, A3 e A4 (foro \u00d826) sul lato Y+.","Da sotto il piano: contropiastra CTP-01 e 4 viti M8\u00d760 per ancoraggio. Serrare a mano: la posizione definitiva si fissa al passo 2."],"vit":["16\u00d7 M8\u00d760 A2 + rondelle","4\u00d7 contropiastra 140\u00d7140\u00d75"],"cpl":"M8: 20 Nm (dopo il passo 2)","chk":"Diagonali tra i centri uguali entro 1 mm.","cam":[-1500,-1500,900],"tgt":[-500,0,0]},{"t":"Telaio portale sugli ancoraggi","ops":["Infilare i 4 perni di centraggio nelle piastre piede (battuta \u00d830) se non gi\u00e0 saldati.","Sollevare il telaio in due con le maniglie e calarlo verticalmente: prima A1, poi A2, poi A3/A4.","Serrare ora le viti M8 degli ancoraggi. Inserire i perni a sfere \u00d88 su A1 e A2."],"vit":["2\u00d7 perno a sfere \u00d88"],"cpl":"M8 ancoraggi: 20 Nm","chk":"Il telaio scende e si sfila senza forzare; nessun gioco percepibile su A1.","cam":[-2300,-2700,1700],"tgt":[0,0,200]},{"t":"Guide X SBR20","ops":["Posare la guida Y\u2212 sul longherone; allinearla con riga e comparatore (rettilineit\u00e0 0,1 su 1800). Serrare le M6 dal centro verso le estremit\u00e0.","Posare la guida Y+ parallela alla prima: comparatore su un pattino di prova che scorre sulla guida Y\u2212.","Ingrassare gli alberi con grasso alimentare NSF H1."],"vit":["2\u00d712 viti M6\u00d720 A2"],"cpl":"M6: 8 Nm","chk":"Parallelismo guide 0,1 su tutta la corsa.","cam":[-1900,-1900,1300],"tgt":[0,0,450]},{"t":"Carrelli X e traversa ponte","ops":["Infilare 2 pattini SBR20UU per guida.","Avvitare le piastre carrello CAR-01 sui pattini (4\u00d7 M6 per pattino), lato largo verso l'esterno.","Avvitare sotto ogni piastra la squadra SQZ-01 (4\u00d7 M8) e sopra la traversa ponte PON-01 (2\u00d7 M8 per lato).","Far scorrere a mano il ponte su tutta la corsa: nessun punto duro. Se tira, allentare le M6 di un lato, far scorrere e risserrare."],"vit":["16\u00d7 M6\u00d716","8\u00d7 M8\u00d720","4\u00d7 M8\u00d760"],"cpl":"M6: 8 Nm \u00b7 M8: 20 Nm","chk":"Ponte che scorre libero, squadro diagonali \u00b10,5.","cam":[-700,-1300,1100],"tgt":[0,0,480]},{"t":"Trasmissione X: albero, pulegge, cinghie, motore X","ops":["Montare i supporti KFL002 sui longheroni (lato X\u2212) e i perni di rinvio (lato X+).","Infilare l'albero di sincronismo da Y+ con le due pulegge 20T; linguette e grani M5 con frenafiletti medio.","Montare le pulegge di rinvio; passare le cinghie aperte e bloccarne le estremit\u00e0 nei morsetti dei carrelli.","Tensionare le due cinghie con la stessa freccia (\u22485 mm con 10 N a met\u00e0 campata): il ponte deve restare in squadro.","Montare la flangia motore, il giunto 8\u219214 e il motore X (M1) sul lato Y+. Allineare albero e motore entro 0,1."],"vit":["8\u00d7 M8 supporti","4\u00d7 M5 motore","2\u00d7 grano M5 pulegge"],"cpl":"M5: 5 Nm \u00b7 M8: 20 Nm","chk":"Ruotando il motore a mano, i due carrelli si muovono insieme senza ritardo.","cam":[-1500,900,900],"tgt":[-800,0,420]},{"t":"Piastre Z con supporti (al banco, poi in macchina)","ops":["Al banco: avvitare su ogni piastra Z i 4 supporti SK16, il BF12 in basso e il BK12 in alto.","Avvitare la piastra Z alla squadra SQZ-01 (4\u00d7 M8). Ripetere per il lato Y+.","Controllare con squadra: piastra Z verticale e perpendicolare al piano entro 0,1/300."],"vit":["16\u00d7 M6 SK16","8\u00d7 M5 BK/BF","8\u00d7 M8 squadre"],"cpl":"M5: 5 Nm \u00b7 M6: 8 Nm \u00b7 M8: 20 Nm","chk":"Fori SK16 coassiali: un albero \u00d816 deve infilarsi nei due supporti senza forzare.","cam":[-700,-1100,700],"tgt":[0,-200,330]},{"t":"Gruppo rullo (al banco)","ops":["Montare i cuscinetti S6204 nelle sedi delle slitte (pressa o tampone, mai colpire l'anello interno).","Infilare il rullo nei cuscinetti, chiudere con i coperchi \u00d872 (4\u00d7 M5).","Avvitare sulle slitte i 4 pattini SC16UU per lato e i supporti delle chiocciole TR16.","La slitta Y\u2212 (ZSL-01) \u00e8 quella con i fori per il motore R."],"vit":["8\u00d7 M5 coperchi","16\u00d7 M5 pattini","8\u00d7 M5 chiocciole"],"cpl":"M5: 5 Nm","chk":"Il rullo gira a mano libero, senza gioco assiale.","cam":[-600,-1000,500],"tgt":[0,0,200]},{"t":"Inserimento gruppo rullo, alberi e viti Z","ops":["Portare il gruppo rullo tra le piastre Z, con i pattini allineati ai supporti SK16.","Infilare gli alberi \u00d816 dall'alto attraverso i fori della piastra carrello, i supporti SK16 e i pattini; serrare le viti degli SK16.","Infilare le viti TR16 dall'alto, avvitarle nelle chiocciole, bloccarle nel BK12 (ghiera) e nel BF12 (seeger)."],"vit":["8\u00d7 vite serraggio SK16","2\u00d7 ghiera BK12"],"cpl":"Ghiera BK12: a mano + controdado","chk":"Girando a mano una vite, la slitta sale e scende senza punti duri su tutta la corsa.","cam":[-700,-1100,900],"tgt":[0,0,330]},{"t":"Motori Z1 e Z2","ops":["Avvitare i 4 distanziali da 40 mm e la flangia motore sopra ogni carrello.","Montare il giunto 8\u219212 sulla vite, poi il motore dall'alto: albero nel giunto, 4\u00d7 M5 sulla flangia.","Serrare il giunto lato motore per ultimo, con la slitta a met\u00e0 corsa."],"vit":["8\u00d7 distanziali \u00d812\u00d740","8\u00d7 M5 flangia","4\u00d7 M5 motori"],"cpl":"M5: 5 Nm \u00b7 viti giunto: 2 Nm","chk":"Le due slitte alla stessa quota (\u00b10,5) prima di serrare i giunti.","cam":[-500,-900,1100],"tgt":[0,0,500]},{"t":"Motore R, cinghia e raschietto","ops":["Puleggia 40T sul perno rullo lato Y\u2212 (linguetta 6 + grano).","Motore R sulla slitta Y\u2212 dall'interno, puleggia 20T sull'albero; cinghia HTD 425-5M; tensionare con le asole (\u00b16 mm).","Barra del raschietto sulle due slitte (2\u00d7 M6), lama POM-C in leggero appoggio sul rullo."],"vit":["4\u00d7 M5 motore R","2\u00d7 M6 barra raschietto"],"cpl":"M5: 5 Nm \u00b7 M6: 8 Nm","chk":"Cinghia R: freccia 3 mm con 5 N. Rullo trascinato senza slittamenti.","cam":[-500,-700,450],"tgt":[0,-150,200]},{"t":"Sensori","ops":["Finecorsa X_MIN e X_MAX sulle staffe interne del longherone Y\u2212: distanza di lettura 2 mm dalla piastra carrello.","Sensori Z HOME (alto) e Z LOW (basso) sulle piastre Z: leggono la bandierina della slitta a 2 mm.","Sensori 'portale in sede' nei piedi A1 e A2 (M12\u00d71): 2 mm sopra l'ancoraggio."],"vit":["8\u00d7 sensori M12 con 2 dadi"],"cpl":"Dadi M12: 10 Nm","chk":"LED del sensore acceso con il pezzo davanti, spento senza.","cam":[-1400,-1400,800],"tgt":[-400,-300,300]},{"t":"Catena portacavi e cavi","ops":["Avvitare la canalina inox sul fianco Y\u2212 del portale e l'estremit\u00e0 fissa della catena al centro (X=0).","Collegare l'estremit\u00e0 mobile alla staffa del carrello Y\u2212.","Posare nella catena i cavi motore, encoder e sensori Z (solo cavi per posa mobile), con raggio \u2265 48 mm; il fascio arriva al quadro lungo il montante X\u2212."],"vit":["6\u00d7 M6 canalina","4\u00d7 M4 attacchi catena"],"cpl":"M6: 8 Nm","chk":"Corsa completa a mano: la catena non tocca la cinghia n\u00e9 il carrello.","cam":[-1300,-1700,900],"tgt":[-300,-400,400]},{"t":"Quadro elettrico sul portale","ops":["Avvitare le due staffe della cassetta al traverso X\u2212 (il quadro sporge oltre il bordo del tavolo).","Montare la colonna luminosa sul tetto e i connettori XP1/XP2 sul fondo.","Collegare i connettori volanti del portale a XP1 (motori/encoder) e XP2 (sensori)."],"vit":["4\u00d7 M8 staffe quadro"],"cpl":"M8: 20 Nm","chk":"Il portale si stacca dal tavolo scollegando solo XP1, XP2 e il cavo di rete.","cam":[-2100,-900,700],"tgt":[-1100,0,300]},{"t":"Interno del quadro (a cura del quadrista)","ops":["Piastra di fondo: canaline 40\u00d725, guide DIN. Fila alta: X0, Q1, Q2, F1\u2013F3, KM1, KM2, K1, F4\u2013F5, F11\u2013F14, X1, X2.","Fila bassa: PSU1 48 V, i 4 driver CL57T montati di fianco (dissipatore verticale, \u226510 mm tra loro), PSU2 24 V, PSU3 12 V, barra BPE.","Parete destra: Arduino Mega + Ethernet, schede opto U6/U7, rel\u00e8 U8, DC/DC U9, morsetti X3/X4/X6/X7. Parete sinistra: ventola filtrata.","Cablare secondo wiring/out/schemi_elettrici.pdf e verificare secondo wiring/README.md."],"vit":[],"cpl":"Morsetti: coppia indicata dal costruttore","chk":"Prove CEI EN 60204-1: continuit\u00e0 PE, isolamento, funzionamento emergenza.","cam":[-1900,-650,650],"tgt":[-1130,0,300],"door":1},{"t":"Collaudo","ops":["Prima accensione senza motori collegati: verificare le tensioni 48/24/12 V e gli ingressi (comando STATUS).","Collegare i motori; JOG piccoli su ogni asse per il verso; HOME; calibrazione della luce con spessimetro (docs/montaggio_collaudo.md).","Prova di emergenza, barriera, STOP e sfilamento portale. Primo ciclo con impasto a velocit\u00e0 ridotta."],"vit":[],"cpl":"","chk":"Tutte le prove di docs/montaggio_collaudo.md superate.","cam":[-2300,-2700,1900],"tgt":[0,0,150]}],"tours":[{"id":"motori","t":"Dove sono i quattro motori","anim":"cycle","focus":["MOT-X","MOT-Z","MOT-R","GIU-X","GIU-Z","QE-01","QE-DRV"],"cam":[-2000,-2300,1700],"tgt":[-300,0,350],"p":["M1 (asse X) \u00e8 fisso sul portale, lato Y+ in fondo a X\u2212: muove il ponte con cinghie e albero di sincronismo.","M2 e M3 (assi Z1 e Z2) stanno sopra i due carrelli e viaggiano con il ponte: ognuno gira la vite che alza o abbassa il proprio lato del rullo.","M4 (asse R) \u00e8 montato sulla slitta Z lato operatore e sale e scende con il rullo, che fa ruotare con una cinghia.","I quattro driver sono nel quadro inox; i cavi arrivano ai motori mobili attraverso la catena portacavi."]},{"id":"servo","t":"Il motore closed-loop","anim":"x","focus":["MOT-X","GIU-X","QE-DRV","QE-LOG"],"cam":[-1700,1300,900],"tgt":[-1000,150,380],"ex":{"MOT-X":0},"p":["Tutti e quattro gli assi usano un motore passo-passo NEMA23 con encoder sul retro e un driver CL57T: \u00e8 un 'servo ibrido'. L'Arduino manda al driver un impulso per ogni passo (STEP) e il verso (DIR); il driver alimenta le due fasi del motore.","L'encoder (1000 linee, 4000 conteggi/giro) dice al driver dove si trova davvero l'albero. Se un carico frena il motore, il driver aumenta la corrente e recupera i passi persi; se l'errore supera la soglia apre il contatto ALM e l'Arduino va in ALLARME.","Rispetto a un servo AC costa meno, tiene la posizione da fermo e si comanda con gli stessi segnali di un passo-passo."]},{"id":"x","t":"Asse X: traslazione del rullo","anim":"x","focus":["MOT-X","GIU-X","ASS-X","PUL-X","BELT-X","KFL","SBR20","SBR20UU","CAR-01","PON-01"],"cam":[-1900,-1500,1200],"tgt":[-300,0,430],"p":["Il motore M1 sta sul lato Y+ in fondo al portale (X\u2212). Tramite un giunto elastico fa girare l'albero di sincronismo, che porta una puleggia 20T per lato: i due lati del ponte si muovono insieme e il rullo resta sempre in squadro.","Le cinghie HTD-5M sono aperte e fissate ai carrelli: un giro di motore = 100 mm di corsa (16 step/mm). I carrelli scorrono su 4 pattini SBR20UU sulle guide \u00d820."]},{"id":"z","t":"Assi Z1 e Z2: altezza del rullo","anim":"z","focus":["MOT-Z","GIU-Z","STM-01","VIT-Z","NUT-Z","ALB-Z","SUP-Z","ZSL-01","ZSL-02","SC16UU","SEN-Z","RUL-01"],"cam":[-900,-1300,800],"tgt":[0,-100,300],"p":["Sopra ogni carrello c'\u00e8 un motore Z (M2 lato operatore, M3 lato opposto) che gira una vite trapezia TR16\u00d74: 1 giro = 4 mm di salita. La chiocciola \u00e8 sulla slitta, che scorre su due guide \u00d816.","La vite \u00e8 autobloccante: a motori spenti il rullo non scende. All'avvio ogni slitta sale fino al proprio sensore HOME: cos\u00ec i due lati si allineano da soli e il rullo resta parallelo al piano.","La quota Z \u00e8 la luce tra rullo e piano, cio\u00e8 lo spessore della sfoglia."]},{"id":"r","t":"Asse R: rotazione del rullo","anim":"r","focus":["MOT-R","BELT-R","PUL-R","RUL-01","BRG-6204","RAS-01"],"cam":[-800,-1050,650],"tgt":[0,-150,200],"p":["Il motore M4 \u00e8 montato sulla slitta Y\u2212 e sale e scende con il rullo. Con una cinghia 20T\u219240T (2:1) fa ruotare il rullo, sostenuto da due cuscinetti inox 6204 nelle slitte.","Il firmware lo comanda 'agganciato' all'asse X: per ogni millimetro di traslazione il rullo ruota di un millimetro di superficie (pi\u00f9 un piccolo overdrive regolabile). Cos\u00ec il rullo rotola sull'impasto invece di trascinarlo. Il raschietto in POM tiene pulita la superficie."]},{"id":"quadro","t":"Dentro il quadro inox","anim":"door","focus":["QE-01","QE-DOOR","QE-PIA","QE-DIN","QE-PSU","QE-DRV","QE-BPE","QE-LOG","QE-FAN","XP","H1"],"cam":[-1900,-650,650],"tgt":[-1130,0,300],"p":["Cassetta inox IP65 500\u00d7400\u00d7250 appesa al traverso X\u2212, fuori dal tavolo. In alto la potenza su guida DIN: interruttore Q1, fusibili, i due contattori KM1+KM2 comandati dal rel\u00e8 di sicurezza K1 (tolgono i 48 V ai driver in emergenza).","In basso l'alimentatore 48 V e i 4 driver CL57T (X, Z1, Z2, R), poi i 24 V per sensori e rel\u00e8 e i 12 V per l'Arduino.","Sulla parete destra la logica: Arduino Mega con Ethernet, schede di ingresso optoisolate, rel\u00e8 delle lampade. Sul fondo i connettori Harting XP1 e XP2: scollegandoli il portale si toglie dal tavolo."]},{"id":"ciclo","t":"Il ciclo di sfogliatura","anim":"cycle","focus":[],"cam":[-2300,-2700,1900],"tgt":[0,0,150],"p":["Rullo alzato, si porta fuori dall'impasto, scende alla luce iniziale (es. 40 mm), passa avanti e indietro. A ogni fine corsa, fuori dall'impasto, scende di qualche millimetro, fino allo spessore finale; poi passate di finitura, si alza e torna al centro."]}]};

const state = {mode:'explore', ex:0, x:0, gap:P.gap_ref, minGap:999, door:0, step:1, f:0, tour:null, playing:true, freeze:false};
const parts = [], spins = [], byCode = {};
function mat(col){ return new THREE.MeshStandardMaterial({color:col, metalness:/^#(1|2)/.test(col)?0.2:0.35, roughness:0.55}); }
function cylMesh(r,l,col,ax){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,Math.max(l,0.1),40), mat(col));
  if(ax==='x') m.rotation.z = Math.PI/2; else if(ax==='z') m.rotation.x = Math.PI/2;
  return m;
}
function markMesh(q){
  const L = q.l*0.92, w = Math.max(3, q.r*0.35), t = 2, r = q.r+0.6;
  const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat('#e0a100'));
  if(q.ax==='y'){ m.scale.set(w,L,t); m.position.set(0,0,r); }
  else if(q.ax==='x'){ m.scale.set(L,w,t); m.position.set(0,0,r); }
  else { m.scale.set(t,w,L); m.position.set(r,0,0); }
  return m;
}
function buildPrim(q, parent, origin){
  const o = origin || [0,0,0];
  if(q.t==='tube'){
    const pts = q.pts.map(p=>new THREE.Vector3(p[0]-o[0],p[1]-o[1],p[2]-o[2]));
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1], d=b.clone().sub(a), len=d.length();
      const m = new THREE.Mesh(new THREE.CylinderGeometry(q.r,q.r,len,16), mat(q.col));
      m.position.copy(a.clone().add(b).multiplyScalar(0.5));
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
      parent.add(m);
      const s = new THREE.Mesh(new THREE.SphereGeometry(q.r,16,10), mat(q.col)); s.position.copy(b); parent.add(s);
    }
    return;
  }
  const c = new THREE.Vector3(q.c[0]-o[0], q.c[1]-o[1], q.c[2]-o[2]);
  if(q.t==='box'){ const m = new THREE.Mesh(new THREE.BoxGeometry(q.s[0],q.s[1],q.s[2]), mat(q.col)); m.position.copy(c); parent.add(m); return; }
  if(q.t==='ell'){ const m = new THREE.Mesh(new THREE.SphereGeometry(1,40,24), mat(q.col)); m.scale.set(q.r[0],q.r[1],q.r[2]); m.position.copy(c); parent.add(m); return; }
  if(q.spin){
    const piv = new THREE.Group(); piv.position.copy(c);
    piv.add(cylMesh(q.r,q.l,q.col,q.ax));
    if(q.mark) piv.add(markMesh(q));
    piv.userData.spin = q.spin; piv.userData.ax = q.ax;
    parent.add(piv); spins.push(piv); return;
  }
  const m = cylMesh(q.r,q.l,q.col,q.ax); m.position.copy(c); parent.add(m);
}
function partCenter(p){
  let n=0; const s=[0,0,0];
  for(const q of p.prims){ for(let i=0;i<3;i++) s[i]+=q.c[i]; n++; }
  if(p.chain) return [p.chain.x0+150, p.chain.y, (p.chain.zl+p.chain.zh)/2];
  return n? s.map(v=>v/n) : [0,0,0];
}
for (const p of MODEL.parts){
  const g = new THREE.Group(); g.userData.part = p;
  if(p.chain){
    const ch=p.chain, mk=()=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat(ch.col)); g.add(m); return m;};
    const R=(ch.zh-ch.zl)/2;
    const bend=new THREE.Mesh(new THREE.CylinderGeometry(R+ch.h/2,R+ch.h/2,ch.w,28,1,false,0,Math.PI),mat(ch.col));
    g.add(bend);
    g.userData.chain={lo:mk(), hi:mk(), bend, R};
  } else if(p.pivot){
    const piv = new THREE.Group(); piv.position.set(...p.pivot.p);
    for(const q of p.prims) buildPrim(q, piv, p.pivot.p);
    g.add(piv); g.userData.pivot = piv;
  } else {
    for(const q of p.prims) buildPrim(q, g);
  }
  g.userData.center = partCenter(p);
  const e = p.dexp && (p.dexp[0]||p.dexp[1]||p.dexp[2]) ? p.dexp : p.explode.map(v=>v*0.6);
  g.userData.stepOff = e;
  scene.add(g); parts.push(g);

}

// ---------------------------------------------------------------- stato → scena
const V0 = 4/3*Math.PI*110*110*55;
function updateDough(){
  if(!dough) return;
  const h = Math.min(55, state.minGap/2), ry = Math.min(175, 110*Math.pow(55/h,0.18));
  const rx = Math.min(760, V0/(4/3*Math.PI*ry*h));
  dough.scale.set(rx,ry,h); dough.position.z = h;
}
const arrows = [];
function clearArrows(){ arrows.forEach(a=>scene.remove(a)); arrows.length=0; }
function layout(){
  const dz = state.gap - P.gap_ref;
  for (const g of parts){
    const p = g.userData.part;
    let o = [0,0,0];
    if(state.mode!=='step'){ const e=p.explode, d=p.dexp||[0,0,0]; o=[(e[0]+d[0]*0.4)*state.ex,(e[1]+d[1]*0.4)*state.ex,(e[2]+d[2]*0.4)*state.ex]; }
    else if(p.step===state.step){ const s=g.userData.stepOff; o=[s[0]*state.f,s[1]*state.f,s[2]*state.f]; }
    if (p.mov!=='fixed') o[0] += state.x;
    if (p.mov==='xz') o[2] += dz;
    g.position.set(o[0],o[1],o[2]);
    if(g.userData.pivot) g.userData.pivot.rotation.z = -state.door*1.75;
    if(g.userData.chain){
      const ch=p.chain, c=g.userData.chain;
      const xcar = state.x - o[0];
      const b = (ch.L + ch.x0 + xcar)/2;
      const lo=Math.max(1,b-ch.x0), hi=Math.max(1,b-xcar);
      c.lo.scale.set(lo,ch.w,ch.h); c.lo.position.set((ch.x0+b)/2, ch.y, ch.zl);
      c.hi.scale.set(hi,ch.w,ch.h); c.hi.position.set((xcar+b)/2, ch.y, ch.zh);
      c.bend.position.set(b, ch.y, (ch.zl+ch.zh)/2);
    }
  }
  const rk = 1/(P.roller_d/2)*1.02;
  for(const piv of spins){
    const s = piv.userData.spin;
    const v = s.src==='z' ? (state.gap-P.gap_ref) : state.x;
    const a = s.k*v;
    if(piv.userData.ax==='x') piv.rotation.x=a; else if(piv.userData.ax==='y') piv.rotation.y=a; else piv.rotation.z=a;
  }
  updateDough();
}

}

}

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;

// ---------------------------------------------------------------- animazioni
let anim=null;
function* moveTo(k,target,v){
  v = v || (k==='x'?18:1.2);
  while(Math.abs(state[k]-target)>0.01){ const d=target-state[k]; state[k]+=Math.sign(d)*Math.min(Math.abs(d),v);
    if(k==='gap') state.minGap=Math.min(state.minGap,state.gap); yield; }
}
function* wait(n){ for(let i=0;i<n;i++) yield; }
function* cycle(){
  const g0=40,g1=5,dg=5,n=1,s0=150,s1=300,m=60, np=Math.ceil((g0-g1)/dg)+n; let gap=g0;
  state.minGap=999;
  yield* moveTo('gap',g0+20); yield* moveTo('x',-(s0+m)); yield* moveTo('gap',g0);
  for(let k=0;k<np;k++){ const s=s0+(s1-s0)*k/Math.max(1,np-1);
    yield* moveTo('x',s+m); gap=Math.max(g1,gap-dg); yield* moveTo('gap',gap); yield* moveTo('x',-(s+m)); }
  yield* moveTo('gap',g1+30); yield* moveTo('x',0);
}
function* loopAnim(kind){
  for(;;){
    if(kind==='x'){ yield* moveTo('x',-500,6); yield* wait(20); yield* moveTo('x',500,6); yield* wait(20); }
    else if(kind==='z'){ yield* moveTo('gap',120,0.6); yield* wait(25); yield* moveTo('gap',10,0.6); yield* wait(25); }
    else if(kind==='r'){ yield* moveTo('x',-250,3); yield* moveTo('x',250,3); }
    else if(kind==='door'){ while(state.door<1){ state.door=Math.min(1,state.door+0.02); yield; } return; }
    else if(kind==='cycle'){ yield* cycle(); yield* wait(60); state.minGap=999; }
    else return;
  }
}
$('run').addEventListener('click',()=>{
  if(anim){anim=null; $('run').textContent='Simula ciclo'; $('run').classList.remove('on'); return;}
  state.ex=0; state.x=0; state.gap=P.gap_ref; anim=cycle(); $('run').textContent='Ferma'; $('run').classList.add('on');
});

  if(s.vit && s.vit.length){ const b=el('div','box'); b.append(el('strong',null,'Viteria')); const ul=el('ul'); s.vit.forEach(v=>ul.append(el('li',null,v))); b.append(ul);
    if(s.cpl) b.append(el('div',null,'Coppie: '+s.cpl)); pS.append(b); }
  pS.append(el('div','check','Controllo: '+s.chk));
  const lst=el('div'); lst.style.marginTop='6px'; lst.append(el('h2',null,'Tutte le fasi'));
  MODEL.steps.forEach((x,i)=>{ if(!i) return; const b=el('button','item'+(i===state.step?' on':'')); b.append(el('b',null,String(i)), el('span',null,x.t)); b.addEventListener('click',()=>goStep(i)); lst.append(b); });
  pS.append(lst);
  $('stTtl').innerHTML=''; const sm=el('small',null,`FASE ${state.step}/${MODEL.steps.length-1}`); $('stTtl').append(sm, document.createTextNode(s.t));
  $('stPrev').disabled = state.step<=1; $('stNext').disabled = state.step>=MODEL.steps.length-1;
}
function goStep(i){
  clearViewBtns();
  state.step=i; const s=MODEL.steps[i];
  resetLook(); state.x=0; state.gap=P.gap_ref; state.minGap=999; state.door=s.door?1:0; state.f=1;
  parts.forEach(g=>{ const p=g.userData.part; g.visible = p.code==='TAV' || p.step<=i; if(p.code==='IMP') g.visible = i>=MODEL.steps.length-1; setGlow(g, p.step===i); });
  const cur = parts.filter(g=>g.userData.part.step===i);
  const seen=new Set();
  setLabels(cur.filter(g=>{const k=g.userData.part.name.replace(/ lato Y[−+].*/,''); if(seen.has(k)) return false; seen.add(k); return true;}).map(g=>({text:g.userData.part.name, g})));
  for(const g of cur){
    const o=g.userData.stepOff, len=Math.hypot(...o); if(len<1) continue;
    const c=new THREE.Vector3(...g.userData.center);
    const dir=new THREE.Vector3(-o[0],-o[1],-o[2]).normalize();
    const a=new THREE.ArrowHelper(dir, c.clone().add(new THREE.Vector3(...o)), len*0.85, new THREE.Color(cssVar('--accent')||'#c98a00').getHex(), Math.min(60,len*0.2), Math.min(30,len*0.1));
    scene.add(a); arrows.push(a);
  }
  // inquadratura automatica: pezzi nuovi nella posizione finale e in quella di partenza
  const box = new THREE.Box3();
  const tgtParts = cur.length ? cur : parts.filter(g=>g.visible && g.userData.part.code!=='TAV');
  for(const f of [0,1]){ state.f=f; layout(); tgtParts.forEach(g=>{ g.updateMatrixWorld(true); box.expandByObject(g); }); }
  state.f=1; layout();
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const r = Math.max(sph.radius*1.08, 260);
  const dir = new THREE.Vector3(s.cam[0]-s.tgt[0], s.cam[1]-s.tgt[1], s.cam[2]-s.tgt[2]).normalize();
  const fovv = camera.fov*Math.PI/180, fovh = 2*Math.atan(Math.tan(fovv/2)*camera.aspect);
  const d = r/Math.sin(Math.min(fovv,fovh)/2);
  const pos = sph.center.clone().add(dir.multiplyScalar(d));
  flyTo(pos.toArray(), sph.center.toArray(), 900);
  anim = stepAnim(); state.playing=true; $('stPlay').textContent='Pausa';
  renderStepPanel(); layout();
}
function* stepAnim(){
  for(;;){ state.f=1; yield* wait(30); for(let i=0;i<=45;i++){ const t=i/45; state.f=1-(t*t*(3-2*t)); yield; } yield* wait(50); }
}
$('stPrev').addEventListener('click',()=>goStep(Math.max(1,state.step-1)));
$('stNext').addEventListener('click',()=>goStep(Math.min(MODEL.steps.length-1,state.step+1)));
$('stPlay').addEventListener('click',()=>{ state.playing=!state.playing; $('stPlay').textContent=state.playing?'Pausa':'Riprendi'; });

// ---------------------------------------------------------------- tabs
function setMode(mode){
  state.mode=mode; anim=null; resetLook(); setLabels([]);
  for(const [m,t,p,c] of [['explore','tab-explore','pExplore','ctrlExplore'],['tour','tab-tour','pTour','ctrlTour'],['step','tab-step','pStep','ctrlStep']]){
    $(t).setAttribute('aria-selected', String(m===mode)); $(p).hidden = m!==mode; $(c).hidden = m!==mode;
  }
  $('run').textContent='Simula ciclo'; $('run').classList.remove('on');
  state.door=0; state.x=0; state.gap=P.gap_ref; state.minGap=999;
  if(mode==='explore'){ setView('iso'); refresh(); }
  if(mode==='tour'){ renderTourList(); startTour(state.tour?state.tour.id:MODEL.tours[0].id); }
  if(mode==='step'){ goStep(state.step||1); }
}
$('tab-explore').addEventListener('click',()=>setMode('explore'));
$('tab-tour').addEventListener('click',()=>setMode('tour'));
$('tab-step').addEventListener('click',()=>setMode('step'));

// ---------------------------------------------------------------- loop
function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
function loop(now){
  if(fly){ const t=Math.min(1,(now-fly.start)/fly.ms), e=t*t*(3-2*t);
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(t>=1) fly=null; }
  if(anim && state.playing && !state.freeze){ const r=anim.next(); if(r.done){ anim=null; if(state.mode==='explore'){ $('run').textContent='Simula ciclo'; $('run').classList.remove('on'); } }
    if(state.mode==='explore') refresh(); else layout(); }
  controls.update(); renderer.render(scene,camera); drawLabels(); requestAnimationFrame(loop);
}
const h = location.hash.replace('#','');
setView('iso'); resize(); refresh();
if(h==='montaggio') setMode('step'); else if(h==='funziona') setMode('tour');
requestAnimationFrame(loop);
window.__mm={state,refresh,layout,setView,select,parts,setMode,goStep,startTour,flyTo,camera,controls,renderer,scene,drawLabels};
</script>

</body></html>
