<title>ManipMasta 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco di lavoro — vista 3D a tutta altezza, pannello tecnico laterale (sotto su telefono), barra comandi in basso alla vista */
:root{
  --bg:#eef1f4; --panel:#f8f9fb; --ink:#1d242c; --muted:#5d6874; --line:#cfd6dd;
  --accent:#c98a00; --accent-ink:#ffffff; --viewport:#e3e8ed; --chip:#e4e9ee;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181e; --panel:#1a2028; --ink:#e4e9ee; --muted:#93a0ad; --line:#2c3540;
  --accent:#f0b429; --accent-ink:#1a1400; --viewport:#161c23; --chip:#232b35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181e; --panel:#1a2028; --ink:#e4e9ee; --muted:#93a0ad; --line:#2c3540;
  --accent:#f0b429; --accent-ink:#1a1400; --viewport:#161c23; --chip:#232b35; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%;min-height:520px}
.stage{position:relative;min-width:0;background:var(--viewport);overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.head{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.views{position:absolute;top:12px;right:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctrl{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px 16px;align-items:end;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.ctrl label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.ctrl label b{font:500 13px var(--f-mono);color:var(--ink);letter-spacing:0;text-transform:none}
input[type=range]{width:100%;accent-color:var(--accent)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
aside h2{font:600 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted)}
.sel{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sel .code{font:500 12px var(--f-mono);color:var(--accent)}
.sel .nm{font:600 20px var(--f-display);line-height:1.1;text-wrap:balance}
.sel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0 0;font-size:13px}
.sel dt{color:var(--muted)} .sel dd{margin:0;min-width:0}
.sel .hint{color:var(--muted);font-size:13px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.grp-h span{font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tog{font:500 11px var(--f-mono);background:var(--chip);border:0;color:var(--ink);padding:4px 8px;border-radius:4px;cursor:pointer;min-height:28px}
.tog.off{opacity:.45}
.part{display:flex;gap:8px;align-items:baseline;padding:5px 4px;border-radius:4px;cursor:pointer;font-size:13px;border:0;background:none;color:var(--ink);text-align:left;width:100%}
.part:hover,.part.on{background:var(--chip)}
.part code{font:500 11px var(--f-mono);color:var(--muted);flex:0 0 74px}
.foot{font-size:12px;color:var(--muted);line-height:1.5}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:68vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
  .ctrl{grid-template-columns:1fr 1fr;left:8px;right:8px;bottom:8px;padding:8px 10px}
  .head h1{font-size:24px}.views{top:auto;bottom:auto;top:62px;left:16px;right:auto;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="Modello 3D della macchina"></canvas>
    <div class="head"><h1>ManipMasta</h1><p id="sub">Sfogliatrice a portale · tavolo 2000×800</p></div>
    <div class="views">
      <button class="btn" data-v="iso">Iso</button><button class="btn" data-v="front">Fronte</button>
      <button class="btn" data-v="side">Lato</button><button class="btn" data-v="top">Alto</button>
    </div>
    <div class="ctrl">
      <label for="ex">Esploso <b id="exv">0 %</b><input id="ex" type="range" min="0" max="100" value="0"></label>
      <label for="xp">Posizione rullo X <b id="xpv">0 mm</b><input id="xp" type="range" min="-700" max="700" value="0"></label>
      <label for="gp">Luce rullo–piano <b id="gpv">40.0 mm</b><input id="gp" type="range" min="2" max="150" value="40" step="0.5"></label>
      <button class="btn" id="run">Simula ciclo</button>
    </div>
  </div>
  <aside>
    <section class="sel" id="info"><span class="code">—</span><span class="nm">Seleziona un pezzo</span><span class="hint">Tocca un componente nella vista o nell'elenco per vederne materiale e fornitura.</span></section>
    <h2>Componenti</h2>
    <div id="list"></div>
    <p class="foot">Modello concettuale generato da <code>cad/model.py</code>. Quote ipotizzate su tavolo standard: si rigenera con le misure reali.</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const MODEL = /*MODEL*/null;
const P = MODEL.params;
document.getElementById('sub').textContent = `Sfogliatrice a portale · tavolo ${P.table_L}×${P.table_W}`;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 10, 20000);
camera.up.set(0,0,1);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.target.set(0,0,200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-1500,-2200,3000); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(2000,1500,800); scene.add(fill);

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function applyTheme(){scene.background = new THREE.Color(cssVar('--viewport')||'#e3e8ed')}
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const parts = [];
let dough = null;
for (const p of MODEL.parts){
  const g = new THREE.Group(); g.userData.part = p;
  for (const q of p.prims){
    let geo, mesh;
    const mat = new THREE.MeshStandardMaterial({color:q.col, metalness:/^#(1|2)/.test(q.col)?0.2:0.35, roughness:0.55});
    if (q.t==='box'){ geo = new THREE.BoxGeometry(Math.abs(q.s[0]),Math.abs(q.s[1]),Math.abs(q.s[2])); mesh = new THREE.Mesh(geo,mat); }
    else if (q.t==='cyl'){ geo = new THREE.CylinderGeometry(q.r,q.r,Math.max(q.l,0.1),40); mesh = new THREE.Mesh(geo,mat);
      if (q.ax==='x') mesh.rotation.z = Math.PI/2; else if (q.ax==='z') mesh.rotation.x = Math.PI/2; }
    else { geo = new THREE.SphereGeometry(1,40,24); mesh = new THREE.Mesh(geo,mat); mesh.scale.set(q.r[0],q.r[1],q.r[2]); }
    mesh.position.set(q.c[0],q.c[1],q.c[2]);
    mesh.userData.base = mesh.position.clone(); mesh.userData.prim = q;
    g.add(mesh);
  }
  scene.add(g);
  parts.push(g);
  if (p.code==='IMP') dough = g.children[0];
}

const state = {ex:0, x:0, gap:P.gap_ref, minGap:999};
const V0 = 4/3*Math.PI*110*110*55;
function updateDough(){
  if(!dough) return;
  const h = Math.min(55, state.minGap/2);
  const ry = Math.min(180, 110*Math.pow(55/h,0.18));
  const rx = Math.min(780, V0/(4/3*Math.PI*ry*h));
  dough.scale.set(rx,ry,h); dough.position.z = h;
}
function layout(){
  const dz = state.gap - P.gap_ref;
  for (const g of parts){
    const p = g.userData.part, e = p.explode;
    let ox=e[0]*state.ex, oy=e[1]*state.ex, oz=e[2]*state.ex;
    if (p.mov!=='fixed') ox += state.x;
    if (p.mov==='xz') oz += dz;
    g.position.set(ox,oy,oz);
  }
  updateDough();
}

const views = {iso:[-2300,-2700,1900], front:[0,-4200,350], side:[-4200,0,350], top:[0,-1,4600]};
function setView(v){
  const k = 1+0.35*state.ex, t = views[v]; camera.position.set(t[0]*k,t[1]*k,t[2]*k); controls.target.set(0,0,v==='top'?0:200); controls.update();
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

const $ = id=>document.getElementById(id);
function bindRange(id, key, fmt){
  const el=$(id); el.addEventListener('input',()=>{state[key]=parseFloat(el.value)/(key==='ex'?100:1); if(key==='gap') state.minGap=Math.min(state.minGap,state.gap); refresh();});
}
function refresh(){
  $('ex').value=Math.round(state.ex*100); $('exv').textContent=Math.round(state.ex*100)+' %';
  $('xp').value=state.x; $('xpv').textContent=Math.round(state.x)+' mm';
  $('gp').value=state.gap; $('gpv').textContent=state.gap.toFixed(1)+' mm';
  layout();
}
bindRange('ex','ex'); bindRange('xp','x'); bindRange('gp','gap');

// selezione
let selected=null;
function select(g){
  if(selected) selected.children.forEach(m=>m.material.emissive.setHex(0x000000));
  selected=g;
  document.querySelectorAll('.part').forEach(b=>b.classList.toggle('on', b._g===g));
  const box=$('info');
  if(!g){return}
  g.children.forEach(m=>m.material.emissive.set(cssVar('--accent')||'#c98a00').multiplyScalar(0.35));
  const p=g.userData.part;
  box.innerHTML='';
  const c=document.createElement('span'); c.className='code'; c.textContent=p.code;
  const n=document.createElement('span'); n.className='nm'; n.textContent=p.name;
  const dl=document.createElement('dl');
  const rows=[['Gruppo',p.group],['Moto',{fixed:'fisso',x:'trasla con X',xz:'trasla con X e sale/scende con Z'}[p.mov]],...Object.entries(p.info)];
  for(const [k,v] of rows){const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd)}
  box.append(c,n,dl);
}
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return;
  const r=canvas.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(parts.filter(g=>g.visible),true)[0];
  select(hit?hit.object.parent:null);
});

// elenco per gruppi
const groups={};
for(const g of parts){(groups[g.userData.part.group]=groups[g.userData.part.group]||[]).push(g)}
const list=$('list');
for(const [name,gs] of Object.entries(groups)){
  const wrap=document.createElement('div'); wrap.className='grp';
  const h=document.createElement('div'); h.className='grp-h';
  const s=document.createElement('span'); s.textContent=name;
  const t=document.createElement('button'); t.className='tog'; t.textContent='visibile'; t.setAttribute('aria-pressed','true');
  t.addEventListener('click',()=>{const on=!gs[0].visible; gs.forEach(g=>g.visible=on); t.classList.toggle('off',!on); t.textContent=on?'visibile':'nascosto'; t.setAttribute('aria-pressed',String(on));});
  h.append(s,t); wrap.append(h);
  for(const g of gs){const b=document.createElement('button'); b.className='part'; b._g=g;
    const c=document.createElement('code'); c.textContent=g.userData.part.code; const n=document.createElement('span'); n.textContent=g.userData.part.name;
    b.append(c,n); b.addEventListener('click',()=>select(g)); wrap.append(b);}
  list.append(wrap);
}

// simulazione ciclo RUN (cx=0 s0=150 s1=300 g0=40 g1=5 dg=5 n=1)
let anim=null;
function* cycle(){
  const g0=40,g1=5,dg=5,n=1,s0=150,s1=300,m=60;
  const np=Math.ceil((g0-g1)/dg)+n; let gap=g0;
  yield* moveTo('gap',g0+20); yield* moveTo('x',-(s0+m)); yield* moveTo('gap',g0);
  for(let k=0;k<np;k++){
    const s=s0+(s1-s0)*k/Math.max(1,np-1);
    yield* moveTo('x',s+m); gap=Math.max(g1,gap-dg); yield* moveTo('gap',gap); yield* moveTo('x',-(s+m));
  }
  yield* moveTo('gap',g1+30); yield* moveTo('x',0);
}
function* moveTo(k,target){
  const v = k==='x'?18:1.2;
  while(Math.abs(state[k]-target)>0.01){ const d=target-state[k]; state[k]+=Math.sign(d)*Math.min(Math.abs(d),v);
    if(k==='gap') state.minGap=Math.min(state.minGap,state.gap); yield; }
}
$('run').addEventListener('click',()=>{
  if(anim){anim=null; $('run').textContent='Simula ciclo'; $('run').classList.remove('on'); return;}
  state.minGap=999; state.ex=0; state.x=0; state.gap=P.gap_ref; anim=cycle(); $('run').textContent='Ferma'; $('run').classList.add('on');
});

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
function loop(){
  if(anim){ const r=anim.next(); if(r.done){anim=null; $('run').textContent='Simula ciclo'; $('run').classList.remove('on');} refresh(); }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
}
// stato iniziale: parametri via hash (#esploso) per i render
if(location.hash==='#esploso'){state.ex=1}
setView('iso'); resize(); refresh(); loop();
window.__mm={state,refresh,setView,select,parts};
</script>
